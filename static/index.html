<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Options Trading Bot</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f1117;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 32px 24px;
      gap: 20px;
    }

    /* ── Signals panel ─────────────────────────────────────────────────────── */
    .signals-card {
      background: #1a1d27;
      border: 1px solid #2d3148;
      border-radius: 16px;
      padding: 28px 32px;
      width: 100%;
      max-width: 560px;
      box-shadow: 0 8px 40px rgba(0,0,0,0.4);
    }

    .signals-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
    }

    .signals-header h2 {
      font-size: 1.1rem;
      font-weight: 600;
      color: #f0f4ff;
    }

    .refresh-btn {
      padding: 7px 16px;
      font-size: 0.82rem;
      font-weight: 600;
      background: #23263a;
      border: 1px solid #2d3148;
      border-radius: 8px;
      color: #a5b4fc;
      cursor: pointer;
      transition: background 0.15s;
      width: auto;
    }
    .refresh-btn:hover:not(:disabled) { background: #2d3148; }
    .refresh-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .spy-price {
      font-size: 0.82rem;
      color: #6b7a99;
      margin-bottom: 14px;
      font-family: "SF Mono", "Fira Code", monospace;
    }
    .spy-price strong { color: #e2e8f0; }

    .indicator-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 10px;
    }

    .indicator-row-full { margin-bottom: 10px; }

    .indicator-tile {
      background: #0f1117;
      border: 1px solid #2d3148;
      border-radius: 10px;
      padding: 14px 16px;
    }

    .indicator-name {
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.7px;
      color: #8892a4;
      margin-bottom: 6px;
    }

    .indicator-value {
      font-size: 1.15rem;
      font-weight: 700;
      color: #e2e8f0;
      font-family: "SF Mono", "Fira Code", monospace;
      margin-bottom: 6px;
    }

    .indicator-signal {
      font-size: 0.72rem;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 4px;
      display: inline-block;
      margin-bottom: 8px;
    }

    .sig-bullish, .sig-falling { background: #0d2b1f; color: #4ade80; border: 1px solid #1a5c38; }
    .sig-bearish, .sig-rising  { background: #2b0d0d; color: #f87171; border: 1px solid #5c1a1a; }
    .sig-neutral               { background: #1a1d27; color: #94a3b8; border: 1px solid #2d3148; }

    .indicator-explanation {
      font-size: 0.72rem;
      color: #4a5568;
      line-height: 1.45;
    }

    .verdict-box {
      border-radius: 10px;
      padding: 16px 18px;
      text-align: center;
      margin-top: 4px;
    }
    .verdict-call { background: #0d2b1f; border: 1px solid #1a5c38; }
    .verdict-put  { background: #2b0d0d; border: 1px solid #5c1a1a; }
    .verdict-none { background: #16182a; border: 1px solid #2d3148; }

    .verdict-label {
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: #8892a4;
      margin-bottom: 4px;
    }
    .verdict-text { font-size: 1.1rem; font-weight: 700; }
    .verdict-call .verdict-text { color: #4ade80; }
    .verdict-put  .verdict-text { color: #f87171; }
    .verdict-none .verdict-text { color: #94a3b8; }

    .fetched-at {
      font-size: 0.68rem;
      color: #4a5568;
      text-align: right;
      margin-top: 12px;
      font-family: "SF Mono", "Fira Code", monospace;
    }

    .signals-loading, .signals-error {
      text-align: center;
      padding: 20px 0;
      font-size: 0.85rem;
      color: #6b7a99;
    }
    .signals-error { color: #f87171; }

    /* ── Order form ────────────────────────────────────────────────────────── */
    .card {
      background: #1a1d27;
      border: 1px solid #2d3148;
      border-radius: 16px;
      padding: 36px 40px;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 8px 40px rgba(0,0,0,0.4);
    }

    h1 {
      font-size: 1.4rem;
      font-weight: 600;
      color: #f0f4ff;
      margin-bottom: 28px;
      letter-spacing: -0.3px;
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 14px;
    }

    label {
      font-size: 0.75rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: #8892a4;
    }

    input, select {
      background: #0f1117;
      border: 1px solid #2d3148;
      border-radius: 8px;
      padding: 10px 12px;
      color: #e2e8f0;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.15s;
      width: 100%;
    }

    input:focus, select:focus { border-color: #5b6bff; }
    select option { background: #1a1d27; }

    .preview {
      background: #0f1117;
      border: 1px solid #2d3148;
      border-radius: 8px;
      padding: 12px 14px;
      font-size: 0.82rem;
      color: #6b7a99;
      margin-bottom: 20px;
      min-height: 36px;
      font-family: "SF Mono", "Fira Code", monospace;
      letter-spacing: 0.2px;
    }
    .preview span { color: #a5b4fc; font-weight: 600; }

    button {
      width: 100%;
      padding: 13px;
      background: #5b6bff;
      color: #fff;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
      letter-spacing: 0.2px;
    }
    button:hover:not(:disabled) { background: #4a5bef; }
    button:active:not(:disabled) { transform: scale(0.98); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }

    .status {
      margin-top: 18px;
      padding: 14px 16px;
      border-radius: 10px;
      font-size: 0.88rem;
      display: none;
    }
    .status.success { display: block; background: #0d2b1f; border: 1px solid #1a5c38; color: #4ade80; }
    .status.error   { display: block; background: #2b0d0d; border: 1px solid #5c1a1a; color: #f87171; }
    .status .label  { font-weight: 700; margin-bottom: 4px; }
    .status .detail { font-family: "SF Mono", "Fira Code", monospace; font-size: 0.8rem; opacity: 0.85; word-break: break-all; }

    .spinner {
      display: inline-block;
      width: 14px; height: 14px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <!-- Signals panel -->
  <div class="signals-card">
    <div class="signals-header">
      <h2>SPY Options Signals</h2>
      <button class="refresh-btn" id="refreshBtn" onclick="loadSignals()">Refresh</button>
    </div>
    <div id="signalsBody">
      <div class="signals-loading"><span class="spinner"></span> Loading signals…</div>
    </div>
  </div>

  <!-- Order form -->
  <div class="card">
    <h1>Place Options Order</h1>

    <div class="row">
      <div class="field">
        <label>Ticker</label>
        <input id="ticker" type="text" placeholder="AAPL" maxlength="6" />
      </div>
      <div class="field">
        <label>Type</label>
        <select id="option_type">
          <option value="call">Call</option>
          <option value="put">Put</option>
        </select>
      </div>
    </div>

    <div class="row">
      <div class="field">
        <label>Strike ($)</label>
        <input id="strike" type="number" placeholder="200.00" step="0.5" min="0.01" />
      </div>
      <div class="field">
        <label>Expiration</label>
        <input id="expiration_date" type="date" />
      </div>
    </div>

    <div class="row">
      <div class="field">
        <label>Limit Buy Price ($)</label>
        <input id="limit_buy_price" type="number" placeholder="3.50" step="0.01" min="0.01" />
      </div>
      <div class="field">
        <label>Qty (contracts)</label>
        <input id="qty" type="number" value="1" min="1" step="1" />
      </div>
    </div>

    <div class="row">
      <div class="field">
        <label>Take Profit Price ($)</label>
        <input id="take_profit_price" type="number" placeholder="5.00" step="0.01" min="0.01" />
      </div>
      <div class="field">
        <label>Stop Loss Price ($)</label>
        <input id="stop_loss_price" type="number" placeholder="2.00" step="0.01" min="0.01" />
      </div>
    </div>

    <div class="preview" id="preview">Fill in the fields above to preview the OCC symbol.</div>

    <button id="sendBtn" onclick="sendOrder()">Send Order</button>

    <div class="status" id="status">
      <div class="label" id="statusLabel"></div>
      <div class="detail" id="statusDetail"></div>
    </div>
  </div>

  <script>
    /* ── Signals ───────────────────────────────────────────────────────────── */
    function sigClass(s) { return 'sig-' + (s || 'neutral'); }

    function tileHtml(name, valueText, sig, explanation) {
      return `<div class="indicator-tile">
        <div class="indicator-name">${name}</div>
        <div class="indicator-value">${valueText}</div>
        <span class="indicator-signal ${sigClass(sig)}">${sig.replace('_', ' ')}</span>
        <div class="indicator-explanation">${explanation}</div>
      </div>`;
    }

    function renderSignals(d) {
      const ind = d.indicators;
      const vxx = d.vxx;
      const vxxTile = vxx
        ? tileHtml('VXX (volatility proxy)', vxx.value, vxx.signal, vxx.explanation)
        : `<div class="indicator-tile"><div class="indicator-name">VXX</div><div class="indicator-explanation" style="padding-top:4px">Unavailable</div></div>`;

      const verdictClass = d.verdict === 'Consider CALL' ? 'verdict-call'
                         : d.verdict === 'Consider PUT'  ? 'verdict-put'
                         : 'verdict-none';

      document.getElementById('signalsBody').innerHTML = `
        <div class="spy-price">SPY last price: <strong>$${d.spy_price}</strong></div>
        <div class="indicator-grid">
          ${tileHtml('RSI (14)', ind.rsi.value, ind.rsi.signal, ind.rsi.explanation)}
          ${tileHtml('MACD Histogram', ind.macd.histogram, ind.macd.signal, ind.macd.explanation)}
        </div>
        <div class="indicator-row-full">
          ${tileHtml('EMA (20)', '$' + ind.ema20.value, ind.ema20.signal, ind.ema20.explanation)}
        </div>
        <div class="indicator-row-full">${vxxTile}</div>
        <div class="verdict-box ${verdictClass}">
          <div class="verdict-label">Combined Signal</div>
          <div class="verdict-text">${d.verdict}</div>
        </div>
        <div class="fetched-at">as of ${d.fetched_at}</div>`;
    }

    async function loadSignals() {
      const btn  = document.getElementById('refreshBtn');
      const body = document.getElementById('signalsBody');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span>';
      body.innerHTML = '<div class="signals-loading"><span class="spinner"></span> Fetching…</div>';
      try {
        const res  = await fetch('/signals');
        const data = await res.json();
        if (!res.ok) {
          body.innerHTML = `<div class="signals-error">Could not load signals: ${data.message ?? res.statusText}</div>`;
        } else {
          renderSignals(data);
        }
      } catch (err) {
        body.innerHTML = `<div class="signals-error">Network error: ${err.message}</div>`;
      } finally {
        btn.disabled = false;
        btn.textContent = 'Refresh';
      }
    }

    document.addEventListener('DOMContentLoaded', loadSignals);

    /* ── Order form ────────────────────────────────────────────────────────── */
    function buildOCC(ticker, expDate, type, strike) {
      if (!ticker || !expDate || !type || !strike) return null;
      const d = new Date(expDate + "T00:00:00");
      const yy = String(d.getFullYear()).slice(2);
      const mm = String(d.getMonth() + 1).padStart(2, "0");
      const dd = String(d.getDate()).padStart(2, "0");
      const cp = type.toLowerCase() === "call" ? "C" : "P";
      const strikeInt = Math.round(parseFloat(strike) * 1000);
      return `${ticker.toUpperCase()}${yy}${mm}${dd}${cp}${String(strikeInt).padStart(8, "0")}`;
    }

    function updatePreview() {
      const ticker  = document.getElementById("ticker").value.trim();
      const type    = document.getElementById("option_type").value;
      const strike  = document.getElementById("strike").value;
      const expDate = document.getElementById("expiration_date").value;
      const occ     = buildOCC(ticker, expDate, type, strike);
      const preview = document.getElementById("preview");
      preview.innerHTML = occ
        ? `OCC symbol: <span>${occ}</span>`
        : "Fill in the fields above to preview the OCC symbol.";
    }

    ["ticker","option_type","strike","expiration_date"].forEach(id =>
      document.getElementById(id).addEventListener("input", updatePreview)
    );

    async function sendOrder() {
      const btn    = document.getElementById("sendBtn");
      const status = document.getElementById("status");
      status.className = "status";

      const payload = {
        ticker:            document.getElementById("ticker").value.trim().toUpperCase(),
        option_type:       document.getElementById("option_type").value,
        strike:            parseFloat(document.getElementById("strike").value),
        limit_buy_price:   parseFloat(document.getElementById("limit_buy_price").value),
        expiration_date:   document.getElementById("expiration_date").value,
        qty:               parseInt(document.getElementById("qty").value, 10),
        take_profit_price: parseFloat(document.getElementById("take_profit_price").value),
        stop_loss_price:   parseFloat(document.getElementById("stop_loss_price").value),
      };

      if (!payload.ticker || isNaN(payload.strike) || isNaN(payload.limit_buy_price) ||
          !payload.expiration_date || isNaN(payload.take_profit_price) || isNaN(payload.stop_loss_price)) {
        document.getElementById("statusLabel").textContent = "Missing fields";
        document.getElementById("statusDetail").textContent = "Please fill in all fields before sending.";
        status.className = "status error";
        return;
      }

      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span>Sending…';

      try {
        const res  = await fetch("/order", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });
        const data = await res.json();
        if (res.ok) {
          document.getElementById("statusLabel").textContent = "Order submitted";
          document.getElementById("statusDetail").textContent =
            `ID: ${data.order_id}  |  Symbol: ${data.symbol}  |  Status: ${data.status}`;
          status.className = "status success";
        } else {
          document.getElementById("statusLabel").textContent = "Order rejected";
          document.getElementById("statusDetail").textContent = data.detail ?? JSON.stringify(data);
          status.className = "status error";
        }
      } catch (err) {
        document.getElementById("statusLabel").textContent = "Network error";
        document.getElementById("statusDetail").textContent = err.message;
        status.className = "status error";
      } finally {
        btn.disabled = false;
        btn.textContent = "Send Order";
      }
    }
  </script>
</body>
</html>
